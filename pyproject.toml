[project]
name = "khulna-salt-intrusion"
version = "0.1.0"
description = "SWOT Khulna API and Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.19",
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "python-multipart>=0.0.9",
    "tenacity>=8.3.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "xarray>=2024.5.0",
    "geopandas>=0.14.4",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "structlog>=24.2.0",
    "torch>=2.3.1",
    "scikit-learn>=1.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.9",
    "mypy>=1.10.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "services*"]
